    // =========================================================================
    const STORAGE_KEY = 'toko_tulus_pos_state_v3_clean';
    const DB_NAME = 'TokoTulusImageDB_v1';
    const STORE_NAME = 'product_images';

    function openImageDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveImageToDB(productId, dataUrl) {
      try {
        const db = await openImageDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          if (dataUrl) {
            tx.objectStore(STORE_NAME).put(dataUrl, productId);
          } else {
            tx.objectStore(STORE_NAME).delete(productId);
          }
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      } catch (err) {
        console.error('Gagal menyimpan gambar ke IndexedDB:', err);
      }
    }

    async function clearAllImagesFromDB() {
      try {
        const db = await openImageDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch (err) {
        console.error('Gagal membersihkan IndexedDB:', err);
      }
    }

    async function loadAllImagesFromDB() {
      try {
        const db = await openImageDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.openCursor();
          const images = {};
          req.onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
              images[cursor.key] = cursor.value;
              cursor.continue();
            } else {
              resolve(images);
            }
          };
          req.onerror = () => resolve({});
        });
      } catch (err) {
        return {};
      }
    }

    function formatRupiah(num) {
      const n = Number(num) || 0;
      const sign = n < 0 ? '-' : '';
      return 'Rp ' + sign + Math.abs(Math.round(n)).toLocaleString('id-ID');
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '-';
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const d = new Date(dateStr + 'T00:00:00');
      if (isNaN(d.getTime())) return dateStr;
      const dayName = days[d.getDay()];
      const dd = String(d.getDate()).padStart(2, '0');
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const yyyy = d.getFullYear();
      return `${dayName}, ${dd}/${mm}/${yyyy}`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bgClass = type === 'warning'
        ? 'bg-amber-600 text-white'
        : type === 'error'
          ? 'bg-rose-600 text-white'
          : 'bg-slate-900 text-white';
      toast.className = `${bgClass} px-4 py-2.5 rounded-2xl shadow-xl text-xs font-extrabold flex items-center gap-2 animate-modal`;
      toast.innerHTML = `<span>${type === 'warning' ? '⚠️' : '✅'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function downloadFullBackupJSON() {
      const backupPayload = {
        app: 'Toko Tulus POS',
        version: '2.1.0',
        exportedAt: new Date().toISOString(),
        data: state
      };
      const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Backup_Toko_Tulus_${getTodayISO()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      state.lastBackupAt = getCurrentTimestamp();
      addSecurityLog('Backup Database Toko (.JSON) diunduh', 'Aman');
      showToast('File backup database berhasil diunduh!');
      render();
    }

    function restoreBackupFromJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const restored = parsed.data ? parsed.data : parsed;
          if (!Array.isArray(restored.products)) {
            showToast('Format file backup tidak valid!', 'error');
            return;
          }
          Object.assign(state, JSON.parse(JSON.stringify(defaultState)), restored);
          state.isLoggedIn = true;

          // Simpan ulang semua gambar dari file backup ke IndexedDB
          for (const prod of state.products) {
            if (prod.imageUrl && prod.imageUrl.startsWith('data:image')) {
              await saveImageToDB(prod.id, prod.imageUrl);
            }
          }

          applyTheme(state.theme);
          addSecurityLog('Restore Database dari file cadangan berhasil', 'Aman');
          saveState();
          showToast('Database Toko Tulus berhasil dipulihkan!');
          render();
        } catch (err) {
          showToast('Gagal membaca file backup JSON', 'error');
        }
      };
      reader.readAsText(file);
    }

    function submitStockAction(e, actionType, productId) {
      e.preventDefault();
      const p = state.products.find(item => item.id === productId);
      if (!p) return;

      const qtyInput = parseInt(document.getElementById('sa-qty').value, 10);
      const noteInput = document.getElementById('sa-note').value.trim();
      const todayStr = getTodayISO();
      const actorTag = state.kasirName ? ` [${state.kasirName}]` : '';

      if (actionType === 'Tambah') {
        const qty = Math.max(1, qtyInput || 0);
        const buyRaw = document.getElementById('sa-buy')?.value;
        const hasNewBuy = buyRaw !== '' && !isNaN(parseInt(buyRaw, 10));
        const usedBuy = hasNewBuy ? parseInt(buyRaw, 10) : p.buyPrice;

        p.stock += qty;
        if (state.autoUpdateBuyPrice && hasNewBuy) {
          p.buyPrice = usedBuy;
        }

        state.history.unshift({
          id: 'h' + Date.now(),
          productId: p.id,
          productName: p.name,
          type: 'Tambah',
          change: qty,
          buyPrice: usedBuy,
          date: todayStr,
          displayDate: formatDisplayDate(todayStr),
          note: (noteInput || 'Penambahan stok manual') + actorTag,
          refCode: null
        });
        showToast(`Stok ${p.name} bertambah +${qty}`);
      } else if (actionType === 'Revisi') {
        const newStock = Math.max(0, qtyInput || 0);
        const diff = newStock - p.stock;
        const oldStock = p.stock;
        p.stock = newStock;

        state.history.unshift({
          id: 'h' + Date.now(),
          productId: p.id,
          productName: p.name,
          type: 'Revisi',
          change: diff,
          buyPrice: p.buyPrice,
          date: todayStr,
          displayDate: formatDisplayDate(todayStr),
          note: (noteInput || `Revisi Stok ${oldStock} -> ${newStock}`) + actorTag,
          refCode: null
        });
        showToast(`Stok ${p.name} direvisi menjadi ${newStock}`);
        addSecurityLog(`Revisi stok ${p.name}: ${oldStock} → ${newStock}`, 'Aman');
      } else if (actionType === 'Terbuang') {
        const qty = Math.min(p.stock, Math.max(1, qtyInput || 0));
        const lossAmount = (Number(p.buyPrice) || 0) * qty;
        p.stock -= qty;
        state.todayProfit -= lossAmount;

        state.history.unshift({
          id: 'h' + Date.now(),
          productId: p.id,
          productName: p.name,
          type: 'Terbuang',
          change: -qty,
          buyPrice: p.buyPrice,
          date: todayStr,
          displayDate: formatDisplayDate(todayStr),
          note: (noteInput || 'Barang rusak / terbuang') + actorTag,
          refCode: null
        });
        showToast(`Dicatat ${qty} ${p.unit} terbuang (Rugi ${formatRupiah(lossAmount)})`, 'warning');
        addSecurityLog(`Stok terbuang ${p.name}: -${qty} ${p.unit}`, 'Peringatan');
      }

      saveState();
      closeModal();
      render();
    }

    function handleProductImageUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 420;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h >= w && h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          tempUploadedProductImage = canvas.toDataURL('image/jpeg', 0.82);

          const previewEl = document.getElementById('pf-image-preview');
          const emptyEl = document.getElementById('pf-image-empty');
          const removeBtn = document.getElementById('pf-image-remove');
          if (previewEl) {
            previewEl.src = tempUploadedProductImage;
            previewEl.classList.remove('hidden');
          }
          if (emptyEl) emptyEl.classList.add('hidden');
          if (removeBtn) removeBtn.classList.remove('hidden');
          showToast('Foto siap disimpan! Klik tombol Simpan');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearTempProductImage() {
      tempUploadedProductImage = '';
      const previewEl = document.getElementById('pf-image-preview');
      const emptyEl = document.getElementById('pf-image-empty');
      const removeBtn = document.getElementById('pf-image-remove');
      const fileInput = document.getElementById('pf-image-input');
      if (previewEl) {
        previewEl.src = '';
        previewEl.classList.add('hidden');
      }
      if (emptyEl) emptyEl.classList.remove('hidden');
      if (removeBtn) removeBtn.classList.add('hidden');
      if (fileInput) fileInput.value = '';
    }

    function updateProductMarginPreview() {
      const buy = parseInt(document.getElementById('pf-buy')?.value, 10) || 0;
      const sell = parseInt(document.getElementById('pf-sell')?.value, 10) || 0;
      const margin = sell - buy;
      const pct = buy > 0 ? Math.round((margin / buy) * 100) : (sell > 0 ? 100 : 0);
      const valEl = document.getElementById('pf-margin-val');
      const boxEl = document.getElementById('pf-margin-box');
      if (valEl && boxEl) {
        valEl.textContent = `${formatRupiah(margin)} (${pct}%)`;
        if (margin < 0) {
          boxEl.className = 'bg-rose-50 border border-rose-200 rounded-xl px-3.5 py-2 flex items-center justify-between text-xs';
          valEl.className = 'font-extrabold text-rose-600';
        } else {

          valEl.className = 'font-extrabold text-emerald-700';
        }
      }
    }

      const meta = iconMap[category] || { icon: '📦', color: 'bg-teal-100 text-teal-800' };
      const finalImage = tempUploadedProductImage || '';
      const todayStr = getTodayISO();

      if (productId) {

        if (p) {
          p.name = name;

          unit,
          stock,
          minStock: 5,
          buyPrice,
          sellPrice,
          sku,
          icon: meta.icon,
          color: meta.color,
          imageUrl: finalImage

          state.history.unshift({

            productName: name,
            type: 'Tambah',

            buyPrice,
            date: todayStr,
            displayDate: formatDisplayDate(todayStr),
            note: 'Stok awal produk baru',
            refCode: null

        showToast(`Produk "${name}" & foto tersimpan permanen`);

      saveState();
      tempUploadedProductImage = '';
      closeModal();
      render();
    }

    function captureAndRecognizeFromCamera() {
      const videoEl = document.getElementById('vision-video');
      if (!videoEl || !videoEl.videoWidth) {
        showToast('Kamera belum siap, gunakan tombol Ambil Foto / Galeri', 'warning');
        return;
      }
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = Math.round((videoEl.videoHeight / videoEl.videoWidth) * 512);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
      identifySembakoWithGemini(base64Data, 'image/jpeg');
    }

    function recognizeFromUploadedFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 512;
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else if (h >= w && h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const base64Data = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
          identifySembakoWithGemini(base64Data, 'image/jpeg');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function identifySembakoWithGemini(base64ImageData, mimeType = 'image/jpeg') {
      const loadingEl = document.getElementById('vision-loading');
      const resultBox = document.getElementById('vision-result-box');
      if (loadingEl) loadingEl.classList.remove('hidden');
      if (resultBox) resultBox.classList.add('hidden');

      const catalogList = state.products.map(p => ({
        id: p.id,
        name: p.name,
        category: p.category,
        price: p.sellPrice,
        unit: p.unit
      }));

      const prompt = `Kamu adalah asisten kasir visual pintar di Toko Sembako "Toko Tulus".
Analisis gambar barang belanjaan ini dan cocokkan dengan daftar produk toko berikut:
${JSON.stringify(catalogList)}

Instruksi:
1. Identifikasi barang sembako yang terlihat pada gambar (misalnya beras, minyak goreng, telur, gula, tepung, mie instan, kopi, sabun, gas elpiji 3kg, snack, dll) dan hitung perkiraan jumlah unitnya jika terlihat lebih dari 1.
2. Pilih ID produk dari daftar di atas yang paling cocok. Jika tidak ada yang cocok sama sekali, isi matchedProductId dengan "" dan sebutkan nama barang yang terdeteksi di detectedName.
3. Jawab HANYA dalam format JSON valid tanpa markdown.`;

      const payload = {
        contents: [
          {
            role: 'user',
            parts: [
              { text: prompt },
              {
                inlineData: {
                  mimeType: mimeType,
                  data: base64ImageData
                }
              }
            ]
          }
        ],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type: 'OBJECT',
            properties: {
              matchedProductId: { type: 'STRING' },
              detectedName: { type: 'STRING' },
              detectedQty: { type: 'INTEGER' },
              confidenceNote: { type: 'STRING' }
            },
            required: ['matchedProductId', 'detectedName', 'detectedQty', 'confidenceNote']
          }
        }
      };

      const apiKey = '';
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      let parsed = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const result = await response.json();
          const rawText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (rawText) {
            parsed = JSON.parse(rawText);
            break;
          }
        } catch (err) {
          if (attempt < 2) {
            await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
          }
        }
      }

      if (loadingEl) loadingEl.classList.add('hidden');
      if (!resultBox) return;

      if (parsed && parsed.matchedProductId) {
        const matched = state.products.find(p => p.id === parsed.matchedProductId);
        if (matched) {
          const qtyToAdd = Math.max(1, Math.min(matched.stock || 1, parseInt(parsed.detectedQty, 10) || 1));
          for (let i = 0; i < qtyToAdd; i++) {
            addToCart(matched.id);
          }

          resultBox.className = 'bg-emerald-50 border border-emerald-300 rounded-2xl p-3.5 space-y-2.5';
          resultBox.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                ${renderProductAvatar(matched, 'w-11 h-11', 'text-xl')}
                <div class="min-w-0">
                  <span class="text-[10px] font-extrabold bg-emerald-600 text-white px-2 py-0.5 rounded-full">✓ Terdeteksi & Masuk Keranjang (+${qtyToAdd})</span>
                  <p class="font-extrabold text-sm text-slate-900 truncate mt-0.5">${matched.name}</p>
                  <p class="text-xs font-bold text-kasmini-primary">${formatRupiah(matched.sellPrice)} × ${qtyToAdd} = ${formatRupiah(matched.sellPrice * qtyToAdd)}</p>
                </div>
              </div>
            </div>
            <p class="text-[11px] text-slate-600">${parsed.confidenceNote || ''}</p>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" onclick="addToCart('${matched.id}'); showToast('+1 ${matched.name}');" class="py-2 rounded-xl bg-white border border-emerald-300 text-emerald-700 font-extrabold text-xs cursor-pointer">
                + Tambah 1 Lagi
              </button>
              <button type="button" onclick="stopVisionCamera(); closeModal();" class="py-2 rounded-xl bg-kasmini-primary text-white font-extrabold text-xs cursor-pointer">
                Lihat Keranjang →
              </button>
            </div>
          `;
          resultBox.classList.remove('hidden');
          showToast(`Dikenali: ${matched.name} (+${qtyToAdd}) masuk keranjang!`);
          return;
        }
      }

      const detectedLabel = parsed?.detectedName || 'Barang Sembako Tidak Dikenal';
      resultBox.className = 'bg-amber-50 border border-amber-300 rounded-2xl p-3.5 space-y-2';
      resultBox.innerHTML = `
        <p class="font-extrabold text-xs text-amber-900">⚠️ Barang Terdeteksi: "${detectedLabel}"</p>
        <p class="text-[11px] text-amber-800">${parsed?.confidenceNote || 'Barang ini belum cocok dengan daftar produk Toko Tulus atau gambar kurang jelas.'}</p>

          <button type="button" onclick="stopVisionCamera(); closeModal(); openProductFormModal();" class="flex-1 py-2 rounded-xl bg-amber-600 text-white font-extrabold text-xs cursor-pointer">
            + Daftarkan Sebagai Produk Baru
          </button>
        </div>
      `;
      resultBox.classList.remove('hidden');
    }

    function addToCart(productId) {
      const p = state.products.find(item => item.id === productId);
      if (!p) return;
      if (p.stock <= 0) {
        showToast(`Stok ${p.name} kosong! Tambah stok dulu`, 'warning');
        return;
      }
      const existing = state.cart.find(c => c.productId === productId);
      if (existing) {
        if (existing.qty >= p.stock) {
          showToast(`Stok maksimal ${p.name} hanya ${p.stock} ${p.unit}`, 'warning');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({ productId, qty: 1 });
      }
      render();
    }

    function updateCartQty(productId, delta) {
      const idx = state.cart.findIndex(c => c.productId === productId);
      if (idx === -1) return;
      const p = state.products.find(item => item.id === productId);
      const nextQty = state.cart[idx].qty + delta;
      if (nextQty <= 0) {
        state.cart.splice(idx, 1);
      } else if (p && nextQty <= p.stock) {
        state.cart[idx].qty = nextQty;
      } else {
        showToast('Melebihi stok tersedia!', 'warning');
      }
      render();
    }

        const gridEl = document.getElementById('kasir-grid-container');
        if (gridEl) {

          listEl.innerHTML = renderStokItemsHTML(filtered);

    function clearSearchInput(mode) {
      if (mode === 'produk') {
        const inputEl = document.getElementById('produk-search-input');
        if (inputEl) {
          inputEl.value = '';
          inputEl.focus();

        handleSearchInput('produk', '');

        if (inputEl) {
          inputEl.value = '';

        handleSearchInput('kasir', '');

    function checkoutCart() {
      if (state.cart.length === 0) return;
      let total = 0;
      let profit = 0;
      const itemsSummary = [];
      const refCode = '#ID-' + Math.floor(10000 + Math.random() * 89999);
      const todayStr = getTodayISO();
      const nowTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const dd = String(new Date().getDate()).padStart(2, '0');
      const mm = String(new Date().getMonth() + 1).padStart(2, '0');
      const yyyy = new Date().getFullYear();
      const cashierName = state.kasirName || 'Owner Toko Tulus';

      state.cart.forEach(item => {
        const p = state.products.find(prod => prod.id === item.productId);
        if (!p) return;
        const qty = Math.min(p.stock, item.qty);
        if (qty <= 0) return;

        p.stock -= qty;
        const sub = p.sellPrice * qty;
        const itemProfit = (p.sellPrice - p.buyPrice) * qty;
        total += sub;
        profit += itemProfit;

        itemsSummary.push({
          name: p.name,
          qty,
          unit: p.unit,
          price: p.sellPrice,
          subtotal: sub
        });

        state.history.unshift({
          id: 'h' + Date.now() + Math.random().toString(36).slice(2, 6),
          productId: p.id,
          productName: p.name,
          type: 'Penggunaan',
          change: -qty,
          buyPrice: p.buyPrice,
          date: todayStr,
          displayDate: formatDisplayDate(todayStr),
          note: `Transaksi ${state.paymentMethod} [${cashierName}]`,
          refCode
        });
      });

      state.todaySales += total;
      state.todayProfit += profit;

      const dayIdx = (new Date().getDay() + 6) % 7; // 0 = Sen, 6 = Min
      if (Array.isArray(state.weeklyStats) && state.weeklyStats[dayIdx]) {
        state.weeklyStats[dayIdx].sales += total;
        state.weeklyStats[dayIdx].profit += profit;
      }

      if (state.paymentMethod === 'Kasbon') {
        state.kasbonBalance = (Number(state.kasbonBalance) || 0) + total;
      }

      const cashPaid = state.paymentMethod === 'Tunai'
        ? (parseInt(state.cashReceived, 10) || total)
        : total;

      state.lastReceipt = {
        refCode,
        date: `${dd}/${mm}/${yyyy} ${nowTime} WIB`,
        cashier: cashierName,
        method: state.paymentMethod,
        items: itemsSummary,
        total,
        paid: cashPaid,
        change: Math.max(0, cashPaid - total)
      };

      state.cart = [];
      state.cashReceived = '';
      saveState();
      showToast('Transaksi berhasil disimpan!');
      render();
      openReceiptModal(state.lastReceipt);
    }

    function addExpenseItem(e) {
      e.preventDefault();
      const title = document.getElementById('exp-title').value.trim();
      const amount = parseInt(document.getElementById('exp-amount').value, 10) || 0;
      if (!title || amount <= 0) return;
      state.expenses.unshift({ id: 'e' + Date.now(), title, amount, category: 'Operasional', date: getTodayISO() });

      const dayIdx = (new Date().getDay() + 6) % 7;
      if (Array.isArray(state.weeklyStats) && state.weeklyStats[dayIdx]) {
        state.weeklyStats[dayIdx].expense += amount;
      }
      saveState();
      showToast('Pengeluaran berhasil dicatat');
      render();
    }

    function renderSalesCharts() {
      if (typeof d3 === 'undefined') return;
      const hideProfit = state.pinEnabled && state.securityRole === 'kasir' && state.securityGuards?.viewProfit;
      const weeklyData = Array.isArray(state.weeklyStats) && state.weeklyStats.length > 0
        ? state.weeklyStats
        : defaultState.weeklyStats;

      const trendEl = document.getElementById('dashboard-trend-chart');
      if (trendEl) {
        trendEl.innerHTML = '';
        const width = trendEl.clientWidth || 340;
        const height = trendEl.clientHeight || 176;
        const margin = { top: 14, right: 16, bottom: 26, left: 44 };
        const innerW = Math.max(120, width - margin.left - margin.right);
        const innerH = Math.max(80, height - margin.top - margin.bottom);

        const svg = d3.select(trendEl)
          .append('svg')
          .attr('width', width)
          .attr('height', height);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const x = d3.scalePoint()
          .domain(weeklyData.map(d => d.day))
          .range([0, innerW])
          .padding(0.2);

        const rawMax = d3.max(weeklyData, d => Math.max(d.sales, d.profit)) || 0;
        const maxVal = rawMax > 0 ? rawMax * 1.15 : 100000;
        const y = d3.scaleLinear()
          .domain([0, maxVal])
          .range([innerH, 0]);

        g.append('g')
          .call(d3.axisLeft(y).ticks(4).tickSize(-innerW).tickFormat(d => d >= 1000000 ? (d / 1000000).toFixed(1) + 'jt' : (d / 1000) + 'rb'))
          .call(ax => ax.select('.domain').remove())
          .call(ax => ax.selectAll('.tick line').attr('stroke', '#E2E8F0').attr('stroke-dasharray', '3,3'))
          .call(ax => ax.selectAll('.tick text').attr('fill', '#64748B').attr('font-size', '10px').attr('font-weight', '600'));

        g.append('g')
          .attr('transform', `translate(0,${innerH})`)
          .call(d3.axisBottom(x))
          .call(ax => ax.select('.domain').attr('stroke', '#CBD5E1'))
          .call(ax => ax.selectAll('.tick line').remove())
          .call(ax => ax.selectAll('.tick text').attr('fill', '#475569').attr('font-size', '10px').attr('font-weight', '700'));

        const areaSales = d3.area()
          .x(d => x(d.day))
          .y0(innerH)
          .y1(d => y(d.sales))
          .curve(d3.curveMonotoneX);

        g.append('path')
          .datum(weeklyData)
          .attr('fill', 'var(--brand-primary, #0F766E)')
          .attr('fill-opacity', 0.12)
          .attr('d', areaSales);

        const lineSales = d3.line()
          .x(d => x(d.day))
          .y(d => y(d.sales))
          .curve(d3.curveMonotoneX);

        g.append('path')
          .datum(weeklyData)
          .attr('fill', 'none')
          .attr('stroke', 'var(--brand-primary, #0F766E)')
          .attr('stroke-width', 2.8)
          .attr('d', lineSales);

        g.selectAll('.dot-sales')
          .data(weeklyData)
          .enter()
          .append('circle')
          .attr('cx', d => x(d.day))
          .attr('cy', d => y(d.sales))
          .attr('r', 4)
          .attr('fill', '#FFFFFF')
          .attr('stroke', 'var(--brand-primary, #0F766E)')
          .attr('stroke-width', 2.4);

        if (!hideProfit) {
          const lineProfit = d3.line()
            .x(d => x(d.day))
            .y(d => y(Math.max(0, d.profit - d.expense)))
            .curve(d3.curveMonotoneX);

          g.append('path')
            .datum(weeklyData)
            .attr('fill', 'none')
            .attr('stroke', '#10B981')
            .attr('stroke-width', 2.4)
            .attr('stroke-dasharray', '4,3')
            .attr('d', lineProfit);

          g.selectAll('.dot-profit')
            .data(weeklyData)
            .enter()
            .append('circle')
            .attr('cx', d => x(d.day))
            .attr('cy', d => y(Math.max(0, d.profit - d.expense)))
            .attr('r', 3.5)
            .attr('fill', '#10B981');
        }
      }

      const barEl = document.getElementById('laporan-bar-chart');
      if (barEl) {
        barEl.innerHTML = '';
        const width = barEl.clientWidth || 340;
        const height = barEl.clientHeight || 224;
        const margin = { top: 14, right: 12, bottom: 28, left: 46 };
        const innerW = Math.max(120, width - margin.left - margin.right);
        const innerH = Math.max(90, height - margin.top - margin.bottom);

        const svg = d3.select(barEl)
          .append('svg')
          .attr('width', width)
          .attr('height', height);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const keys = hideProfit ? ['sales', 'expense'] : ['sales', 'profit', 'expense'];
        const colorMap = { sales: 'var(--brand-primary, #0F766E)', profit: '#10B981', expense: '#F43F5E' };

        const x0 = d3.scaleBand()
          .domain(weeklyData.map(d => d.day))
          .rangeRound([0, innerW])
          .paddingInner(0.24);

        const x1 = d3.scaleBand()
          .domain(keys)
          .rangeRound([0, x0.bandwidth()])
          .padding(0.12);

        const rawMax = d3.max(weeklyData, d => Math.max(d.sales, d.profit, d.expense)) || 0;
        const maxVal = rawMax > 0 ? rawMax * 1.15 : 100000;
        const y = d3.scaleLinear()
          .domain([0, maxVal])
          .rangeRound([innerH, 0]);

        g.append('g')
          .call(d3.axisLeft(y).ticks(4).tickSize(-innerW).tickFormat(d => d >= 1000000 ? (d / 1000000).toFixed(1) + 'jt' : (d / 1000) + 'rb'))
          .call(ax => ax.select('.domain').remove())
          .call(ax => ax.selectAll('.tick line').attr('stroke', '#E2E8F0').attr('stroke-dasharray', '3,3'))
          .call(ax => ax.selectAll('.tick text').attr('fill', '#64748B').attr('font-size', '10px').attr('font-weight', '600'));

        g.append('g')
          .attr('transform', `translate(0,${innerH})`)
          .call(d3.axisBottom(x0))
          .call(ax => ax.select('.domain').attr('stroke', '#CBD5E1'))
          .call(ax => ax.selectAll('.tick line').remove())
          .call(ax => ax.selectAll('.tick text').attr('fill', '#334155').attr('font-size', '11px').attr('font-weight', '700'));

        const dayGroup = g.selectAll('.day-group')
          .data(weeklyData)
          .enter()
          .append('g')
          .attr('transform', d => `translate(${x0(d.day)},0)`);

        dayGroup.selectAll('rect')
          .data(d => keys.map(k => ({ key: k, value: d[k] || 0 })))
          .enter()
          .append('rect')
          .attr('x', d => x1(d.key))
          .attr('y', d => y(d.value))
          .attr('width', x1.bandwidth())
          .attr('height', d => d.value > 0 ? Math.max(3, innerH - y(d.value)) : 0)
          .attr('rx', 3)
          .attr('fill', d => colorMap[d.key]);
      }

      const catEl = document.getElementById('laporan-category-chart');
      if (catEl) {
        catEl.innerHTML = '';
        const catMap = {};
        state.products.forEach(p => {
          const shortCat = (p.category || 'Lainnya').split('&')[0].trim();
          catMap[shortCat] = (catMap[shortCat] || 0) + (p.sellPrice * p.stock);
        });
        const catData = Object.entries(catMap)
          .map(([label, value]) => ({ label, value }))
          .sort((a, b) => b.value - a.value)
          .slice(0, 6);

        const width = catEl.clientWidth || 340;
        const height = catEl.clientHeight || 240;
        const margin = { top: 8, right: 64, bottom: 16, left: 92 };
        const innerW = Math.max(90, width - margin.left - margin.right);
        const innerH = Math.max(100, height - margin.top - margin.bottom);

        const svg = d3.select(catEl)
          .append('svg')
          .attr('width', width)
          .attr('height', height);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const y = d3.scaleBand()
          .domain(catData.map(d => d.label))
          .range([0, innerH])
          .padding(0.28);

        const rawMaxCat = d3.max(catData, d => d.value) || 0;
        const x = d3.scaleLinear()
          .domain([0, rawMaxCat > 0 ? rawMaxCat * 1.1 : 100000])
          .range([0, innerW]);

        g.append('g')
          .call(d3.axisLeft(y))
          .call(ax => ax.select('.domain').remove())
          .call(ax => ax.selectAll('.tick line').remove())
          .call(ax => ax.selectAll('.tick text').attr('fill', '#334155').attr('font-size', '11px').attr('font-weight', '700'));

        const barColors = ['#0F766E', '#0D9488', '#D97706', '#2563EB', '#059669', '#7C3AED'];

        g.selectAll('.cat-bar')
          .data(catData)
          .enter()
          .append('rect')
          .attr('y', d => y(d.label))
          .attr('x', 0)
          .attr('height', y.bandwidth())
          .attr('width', d => d.value > 0 ? Math.max(4, x(d.value)) : 2)
          .attr('rx', 6)
          .attr('fill', (_, i) => barColors[i % barColors.length]);

        g.selectAll('.cat-val')
          .data(catData)
          .enter()
          .append('text')
          .attr('x', d => (d.value > 0 ? x(d.value) : 2) + 6)
          .attr('y', d => y(d.label) + y.bandwidth() / 2 + 4)
          .attr('fill', '#334155')
          .attr('font-size', '10px')
          .attr('font-weight', '800')
          .text(d => d.value > 0 ? (d.value / 1000).toLocaleString('id-ID') + 'rb' : 'Rp 0');
      }
    }

                    <span class="text-xs font-bold text-slate-700">Jumlah Tambah</span>
                    <div class="flex items-center gap-2">
                      <button onclick="state.bulkItems[${idx}].qty = Math.max(1, (parseInt(state.bulkItems[${idx}].qty, 10) || 1) - 1); render();" class="w-8 h-8 rounded-xl bg-rose-500 text-white font-black cursor-pointer">−</button>
                      <input type="number" min="1" value="${item.qty}" onchange="state.bulkItems[${idx}].qty = Math.max(1, parseInt(this.value, 10) || 1); render();" class="w-16 text-center border border-slate-300 rounded-xl py-1.5 text-sm font-extrabold bg-white" />
                      <button onclick="state.bulkItems[${idx}].qty = (parseInt(state.bulkItems[${idx}].qty, 10) || 0) + 1; render();" class="w-8 h-8 rounded-xl bg-[#059669] text-white font-black cursor-pointer">+</button>
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Harga Beli Baru</label>
                      <input type="number" min="0" value="${item.buyPrice}" oninput="state.bulkItems[${idx}].buyPrice = this.value" placeholder="Modal: ${p.buyPrice}" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold" />
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Catatan</label>
                      <input type="text" value="${item.note}" oninput="state.bulkItems[${idx}].note = this.value" placeholder="Supplier / ket." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium" />
                    </div>
                  </div>

                  <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                    <span class="font-bold text-slate-500">Estimasi Stok Akhir</span>
                    <span class="font-extrabold text-[#059669]">${estFinal} ${p.unit}</span>
                  </div>
                </div>
              `;
            }).join('')}

            ${state.bulkItems.length > 0 ? `
              <button onclick="confirmBulkRestock()" class="w-full py-3.5 rounded-2xl bg-kasmini-primary hover:bg-kasmini-medium text-white font-extrabold text-sm shadow-lg cursor-pointer transition">
                💾 Simpan Stok (${state.bulkItems.length} Produk)
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function openBulkProductPicker() {
      const modalRoot = document.getElementById('modal-root');
      const selectedIds = new Set(state.bulkItems.map(i => i.productId));
      modalRoot.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/55 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col animate-modal">
            <div class="bg-kasmini-primary text-white px-5 py-4 flex items-center justify-between">
              <h3 class="font-extrabold text-base">Pilih Produk Sembako</h3>
              <button onclick="closeModal()" class="p-1.5 rounded-xl bg-white/15 cursor-pointer">✕</button>
            </div>
            <div class="p-4 space-y-2 overflow-y-auto flex-1">
              ${state.products.map(p => {
                const isSel = selectedIds.has(p.id);
                return `
                  <button onclick="toggleBulkProduct('${p.id}')" class="w-full p-3 rounded-2xl border ${isSel ? 'border-kasmini-primary bg-kasmini-light' : 'border-slate-200 bg-white'} flex items-center justify-between text-left cursor-pointer">
                    <div class="flex items-center gap-3 min-w-0">
                      ${renderProductAvatar(p, 'w-10 h-10', 'text-lg')}
                      <div class="min-w-0">
                        <p class="font-extrabold text-xs text-slate-800 truncate">${p.name}</p>
                        <p class="text-[11px] text-slate-500">Stok: ${p.stock} ${p.unit}</p>
                      </div>
                    </div>
                    <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${isSel ? 'bg-kasmini-primary text-white' : 'border border-slate-300 text-transparent'}">✓</span>
                  </button>
                `;
              }).join('')}
            </div>
            <div class="p-4 border-t border-slate-100">
              <button onclick="closeModal(); render();" class="w-full py-3 rounded-xl bg-kasmini-primary text-white font-extrabold text-xs cursor-pointer">Selesai</button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleBulkProduct(productId) {
      const idx = state.bulkItems.findIndex(i => i.productId === productId);
      if (idx >= 0) {
        state.bulkItems.splice(idx, 1);
      } else {
        state.bulkItems.push({ productId, qty: 1, buyPrice: '', note: '' });
      }
      openBulkProductPicker();
    }

    function confirmBulkRestock() {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="fixed inset-0 bg-slate-900/55 backdrop-blur-xs z-50 flex items-center justify-center p-4">
          <div class="bg-white w-full max-w-xs rounded-3xl p-6 text-center shadow-2xl animate-modal space-y-4">
            <div class="w-14 h-14 rounded-full bg-kasmini-primary text-white text-2xl font-black flex items-center justify-center mx-auto">!</div>
            <div>
              <h3 class="font-extrabold text-base text-slate-900">Konfirmasi !!!</h3>
              <p class="text-xs text-slate-600 mt-1">Anda yakin akan menambah stok ${state.bulkItems.length} produk yang terpilih?</p>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="closeModal()" class="py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs cursor-pointer">Batal</button>
              <button onclick="executeBulkRestock()" class="py-2.5 rounded-xl bg-kasmini-primary text-white font-extrabold text-xs cursor-pointer">Ok</button>
            </div>
          </div>
        </div>
      `;
    }

    function executeBulkRestock() {
      const todayStr = getTodayISO();
      const actorTag = state.kasirName ? ` [${state.kasirName}]` : '';
      state.bulkItems.forEach(item => {
        const p = state.products.find(prod => prod.id === item.productId);
        if (!p) return;
        const qty = Math.max(1, parseInt(item.qty, 10) || 1);
        const hasNewBuy = item.buyPrice !== '' && !isNaN(parseInt(item.buyPrice, 10));
        const usedBuy = hasNewBuy ? parseInt(item.buyPrice, 10) : p.buyPrice;

        p.stock += qty;
        if (state.autoUpdateBuyPrice && hasNewBuy) {
          p.buyPrice = usedBuy;
        }

        state.history.unshift({
          id: 'h' + Date.now() + Math.random().toString(36).slice(2, 6),
          productId: p.id,
          productName: p.name,
          type: 'Tambah',
          change: qty,
          buyPrice: usedBuy,
          date: todayStr,
          displayDate: formatDisplayDate(todayStr),
          note: (item.note || 'Penambahan Stok Massal') + actorTag,
          refCode: null
        });
      });

      state.bulkItems = [];
      saveState();
      closeModal();
      showToast('Berhasil menambah stok produk!');
      navigate('stok');
    }

    // =========================================================================
    // VIEW 5: RIWAYAT STOK GLOBAL & EKSPOR CSV
    // =========================================================================
    function renderGlobalHistory() {
      const tabs = ['Semua', 'Penggunaan', 'Tambah', 'Revisi', 'Terbuang'];
      const filtered = state.history.filter(h => {
        const matchTab = state.globalFilter === 'Semua' || h.type === state.globalFilter;
        const matchStart = !state.globalDateStart || h.date >= state.globalDateStart;
        const matchEnd = !state.globalDateEnd || h.date <= state.globalDateEnd;
        return matchTab && matchStart && matchEnd;
      });

      return `
        <div class="animate-view">
          <div class="bg-kasmini-primary text-white px-4 sm:px-6 py-4 flex items-center justify-between sticky top-0 z-10 shadow-md">
            <div class="flex items-center gap-3">
              <button onclick="navigate('dashboard')" class="p-2 rounded-xl hover:bg-white/10 transition cursor-pointer">←</button>
              <h1 class="font-extrabold text-lg">Riwayat Stok</h1>
            </div>
            <button onclick="exportHistoryCSV(null)" class="px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-extrabold cursor-pointer">📄 Ekspor CSV</button>
          </div>

          <div class="p-4 sm:p-6 space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5">
                <label class="block text-[10px] font-bold text-slate-400 uppercase">Tgl Mulai</label>
                <input type="date" value="${state.globalDateStart}" onchange="state.globalDateStart = this.value; render();" class="w-full text-xs sm:text-sm font-bold text-slate-700 bg-transparent focus:outline-none mt-0.5" />
              </div>
              <div class="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5">
                <label class="block text-[10px] font-bold text-slate-400 uppercase">Tgl Akhir</label>
                <input type="date" value="${state.globalDateEnd}" onchange="state.globalDateEnd = this.value; render();" class="w-full text-xs sm:text-sm font-bold text-slate-700 bg-transparent focus:outline-none mt-0.5" />
              </div>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-1">
              ${tabs.map(tab => `
                <button onclick="state.globalFilter = '${tab}'; render();" class="px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap cursor-pointer ${
                  state.globalFilter === tab ? 'bg-kasmini-primary text-white' : 'bg-white text-slate-600 border border-slate-200'
                }">${tab}</button>
              `).join('')}
            </div>

            <div class="space-y-3">
              ${filtered.length === 0 ? `
                <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                  <p class="font-bold text-sm text-slate-600">Belum ada riwayat stok tercatat</p>
                </div>
              ` : filtered.map(h => renderHistoryDetailCard(h, true)).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function exportHistoryCSV(productId = null) {
      const rows = productId ? state.history.filter(h => h.productId === productId) : state.history;
      const csvLines = [
        ['Tanggal', 'Produk', 'Tipe', 'Perubahan', 'Harga Beli', 'Catatan', 'Referensi'].join(',')
      ];
      rows.forEach(r => {
        csvLines.push([
          `"${r.date}"`,
          `"${(r.productName || '').replace(/"/g, '""')}"`,
          `"${r.type}"`,
          r.change,
          r.buyPrice || 0,
          `"${(r.note || '').replace(/"/g, '""')}"`,
          `"${r.refCode || '-'}"`
        ].join(','));
      });
      const blob = new Blob([csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Riwayat_Stok_Toko_Tulus_${getTodayISO()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('File CSV riwayat stok berhasil diunduh!');
    }

    // =========================================================================
    // VIEW 6: PENGATURAN STOK & TAMPILAN TOKO
    // =========================================================================
    function renderPengaturanStok() {
      return `
        <div class="animate-view">
          <div class="bg-kasmini-primary text-white px-4 sm:px-6 py-4 flex items-center gap-3 sticky top-0 z-10 shadow-md">
            <button onclick="navigate('dashboard')" class="p-2 rounded-xl hover:bg-white/10 transition cursor-pointer">←</button>
            <h1 class="font-extrabold text-lg">Pengaturan Stok & Toko</h1>
          </div>

          <div class="p-4 sm:p-6 max-w-xl mx-auto space-y-4">
            <div class="bg-white rounded-2xl p-5 border-2 border-kasmini-primary/30 shadow-xs space-y-2">
              <div class="flex items-center justify-between gap-4">
                <div>
                  <h3 class="font-extrabold text-sm text-slate-900">Update Harga Beli saat tambah Stok</h3>
                  <p class="text-xs text-slate-500 mt-0.5">
                    ${state.autoUpdateBuyPrice
                      ? 'Aktif: Harga modal produk otomatis mengikuti harga beli terbaru saat restock.'
                      : 'Nonaktif: Harga beli dicatat di riwayat saja tanpa mengubah modal produk.'}
                  </p>
                </div>
                <button
                  onclick="state.autoUpdateBuyPrice = !state.autoUpdateBuyPrice; saveState(); showToast(state.autoUpdateBuyPrice ? 'Update Harga Beli: AKTIF' : 'Update Harga Beli: NONAKTIF'); render();"
                  class="w-14 h-8 rounded-full p-1 transition-colors shrink-0 cursor-pointer ${state.autoUpdateBuyPrice ? 'bg-kasmini-primary' : 'bg-slate-300'}"
                >
                  <div class="w-6 h-6 rounded-full bg-white shadow transform transition-transform ${state.autoUpdateBuyPrice ? 'translate-x-6' : 'translate-x-0'}"></div>
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-slate-200 space-y-3">
              <h3 class="font-extrabold text-sm text-slate-800">Tema Warna Aplikasi</h3>
              <div class="grid grid-cols-2 gap-2.5">
                ${Object.entries(THEMES).map(([k, t]) => `
                  <button
                    onclick="setTheme('${k}')"
                    class="p-3 rounded-xl border ${state.theme === k ? 'border-kasmini-primary bg-kasmini-light font-extrabold' : 'border-slate-200 font-semibold'} flex items-center gap-2.5 text-xs text-slate-800 cursor-pointer"
                  >
                    <span class="w-5 h-5 rounded-full shrink-0" style="background-color: ${t.swatch};"></span>
                    <span>${t.name}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-slate-200 flex items-center justify-between gap-3">
              <div>
                <h3 class="font-extrabold text-sm text-slate-800">Kosongkan / Reset Data ke 0</h3>
                <p class="text-xs text-slate-500">Hapus semua riwayat transaksi, laba, pengeluaran & foto tersimpan</p>
              </div>
              <button onclick="resetDemoData()" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-extrabold text-xs cursor-pointer shrink-0">
                Reset 0
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // MAIN RENDER ROUTER
    // =========================================================================
    function render() {
      saveState();
      updateNavHighlight();
      const container = document.getElementById('app-content');
      switch (state.view) {
        case 'dashboard':
          container.innerHTML = renderDashboard();
          break;
        case 'stok':
          container.innerHTML = renderStokList();
          break;
        case 'detail-stok':
          container.innerHTML = renderDetailStok();
          break;
        case 'tambah-stok':
          container.innerHTML = renderBulkRestock();
          break;
        case 'riwayat':
          container.innerHTML = renderGlobalHistory();
          break;
        case 'pengaturan':
          container.innerHTML = renderPengaturanStok();
          break;
        case 'produk':
          container.innerHTML = renderKelolaProduk();
          break;
        case 'kasir':
          container.innerHTML = renderKasir();
          break;
        case 'grosir':
          container.innerHTML = renderHargaGrosir();
          break;
        case 'pengeluaran':
          container.innerHTML = renderPengeluaran();
          break;
        case 'laporan':
          container.innerHTML = renderLaporan();
          break;
        case 'pelanggan':
          container.innerHTML = renderPelanggan();
          break;
        case 'kasir-profil':
          container.innerHTML = renderKasirProfil();
          break;
        case 'metode-bayar':
          container.innerHTML = renderMetodeBayar();
          break;
        case 'cetak-resi':
          container.innerHTML = renderCetakResi();
          break;
        case 'keamanan':
          container.innerHTML = renderKeamanan();
          break;
        default:
          container.innerHTML = renderDashboard();
      }
      requestAnimationFrame(renderSalesCharts);
    }

    window.addEventListener('resize', () => {
      if (state.view === 'dashboard' || state.view === 'laporan') {
        renderSalesCharts();
      }
    });

    // Initialize Application & Pulihkan Gambar dari IndexedDB
    window.addEventListener('DOMContentLoaded', async () => {
      applyTheme(state.theme);
      const savedImages = await loadAllImagesFromDB();
      state.products.forEach(p => {
        if (savedImages[p.id]) {
          p.imageUrl = savedImages[p.id];
        } else if (p.imageUrl === '__IDB__') {
          p.imageUrl = '';
        }
      });
      updateNavHighlight();
      render();
      renderLockScreen();
      resetAutoLockTimer();
    });
  </script>
</body>
</html>
